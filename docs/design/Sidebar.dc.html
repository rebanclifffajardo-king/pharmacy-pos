<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: {{rootW}}; max-width: 100%; height: 100%; min-height: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E4E7F0; display: flex; flex-direction: column; font-family: Inter, sans-serif; color: #0F1733; transition: width 200ms cubic-bezier(.2,.8,.2,1)">
  <div style="height: 72px; display: flex; align-items: center; justify-content: center; padding: 0 16px; border-bottom: 1px solid #E4E7F0; box-sizing: border-box">
    <sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
      <img src="/_blob/9c938db2c9d796a705b4f7740e130485" alt="YasMar Pharmacy" style="width: 44px; height: 44px; display: block">
    </sc-if>
    <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
      <img src="/_blob/e52fd4a1bd56b3f116f07d7d8c2f45be" alt="YasMar Pharmacy — Affordable Medicine, Right Nextdoor" style="width: 200px; height: auto; display: block">
    </sc-if>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">
    <p style="{{groupStyle}}">Operations</p>
    <a href="Dashboard.dc.html" style="{{s.dashboard}}" title="Dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span style="{{labelStyle}}">Dashboard</span>
    </a>
    <a href="POS.dc.html" style="{{s.pos}}" title="Point of Sale">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span style="{{labelStyle}}">Point of Sale</span>
    </a>

    <p style="{{groupStyle}}">Inventory</p>
    <a href="Inventory.dc.html" style="{{s.inventory}}" title="Medicine Inventory">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
      <span style="{{labelStyle}}">Medicine Inventory</span>
      <span style="{{badgeAmber}}">25</span>
    </a>
    <a href="Expiry.dc.html" style="{{s.stock}}" title="Stock Management">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.29 7 12 12l8.71-5"/><path d="M12 22V12"/></svg>
      <span style="{{labelStyle}}">Stock Management</span>
      <span style="{{badgeOrange}}">15</span>
    </a>
    <a href="PurchaseOrders.dc.html" style="{{s.po}}" title="Purchase Orders">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      <span style="{{labelStyle}}">Purchase Orders</span>
    </a>
    <a href="PurchaseOrders.dc.html" style="{{s.suppliers}}" title="Suppliers">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
      <span style="{{labelStyle}}">Suppliers</span>
    </a>

    <p style="{{groupStyle}}">Sales</p>
    <a href="Sales.dc.html" style="{{s.sales}}" title="Sales &amp; Transactions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
      <span style="{{labelStyle}}">Sales &amp; Transactions</span>
    </a>
    <a href="Sales.dc.html" style="{{s.returns}}" title="Returns &amp; Refunds">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      <span style="{{labelStyle}}">Returns &amp; Refunds</span>
    </a>
    <a href="Reports.dc.html" style="{{s.reports}}" title="Reports &amp; Analytics">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span style="{{labelStyle}}">Reports &amp; Analytics</span>
    </a>

    <p style="{{groupStyle}}">Admin</p>
    <a href="Users.dc.html" style="{{s.users}}" title="User Management">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span style="{{labelStyle}}">User Management</span>
    </a>
    <a href="Receipt.dc.html" style="{{s.settings}}" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="{{labelStyle}}">Settings</span>
    </a>
  </div>

  <div style="padding: 12px; border-top: 1px solid #E4E7F0; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFF4D6; border: 1px solid #F3DC9C; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font: 700 11px Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #7A4E00">Demo Mode</span>
        <span style="font: 400 12px Inter, sans-serif; color: #5C3B00; line-height: 1.4">Sample data · no live payments or printer</span>
      </div>
    </sc-if>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="height: 44px; border-radius: 10px; border: 1px solid #E4E7F0; background: #fff; color: #3A4160; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 13px Inter, sans-serif; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chevStyle}}"><path d="m15 18-6-6 6-6"/></svg>
      <span style="{{labelStyle}}">Collapse</span>
    </button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","pos","inventory","stock","po","suppliers","sales","returns","reports","users","settings"],"default":"dashboard"},"collapsed":{"editor":"boolean","default":false},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { collapsed: null }; }
  renderVals() {
    const collapsed = this.state.collapsed ?? !!this.props.collapsed;
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font: 500 14px Inter, sans-serif; transition: background 160ms; ' + (collapsed ? 'justify-content: center; ' : '');
    const keys = ['dashboard','pos','inventory','stock','po','suppliers','sales','returns','reports','users','settings'];
    const s = {};
    keys.forEach(k => {
      s[k] = base + (k === active ? 'background: #EEF1FF; color: #1A2FCC; font-weight: 600; box-shadow: inset 3px 0 0 #223CFF;' : 'color: #3A4160;');
    });
    const badge = 'margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; display: ' + (collapsed ? 'none' : 'inline-flex') + '; align-items: center; justify-content: center; font: 700 11px Inter, sans-serif; box-sizing: border-box;';
    return {
      s,
      collapsed,
      expanded: !collapsed,
      rootW: collapsed ? '76px' : '248px',
      labelStyle: collapsed ? 'display: none' : 'white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
      groupStyle: 'margin: 14px 12px 6px; font: 700 11px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6B7189; ' + (collapsed ? 'visibility: hidden; height: 4px; margin: 6px 0 0; overflow: hidden;' : ''),
      badgeAmber: badge + 'background: #FFF4D6; color: #7A4E00;',
      badgeOrange: badge + 'background: #FFEADD; color: #A3360A;',
      chevStyle: collapsed ? 'transform: rotate(180deg); transition: transform 200ms' : 'transition: transform 200ms',
      toggleLabel: collapsed ? 'Expand sidebar' : 'Collapse sidebar',
      toggle: () => this.setState({ collapsed: !collapsed }),
    };
  }
}
</script>
</body>
</html>
