<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; min-height: 72px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E7F0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 24px; font-family: Inter, sans-serif; color: #0F1733">
  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 200px">
    <h1 style="margin: 0; font: 600 20px Poppins, sans-serif; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</h1>
    <span style="font: 400 12px Inter, sans-serif; color: #555C78; white-space: nowrap">{{subtitle}}</span>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 1px solid #E4E7F0; border-radius: 12px; background: #F6F7FB; flex: 1 1 260px; max-width: 380px; min-width: 0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555C78" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Global search</span>
    <input type="search" placeholder="Search medicines, receipts, suppliers…" style="border: 0; outline: 0; background: transparent; font: 400 14px Inter, sans-serif; color: #0F1733; flex: 1; min-width: 0">
    <span style="font: 600 11px Inter, sans-serif; color: #555C78; border: 1px solid #D5D9E6; border-radius: 6px; padding: 2px 6px; background: #fff">⌘K</span>
  </label>

  <button type="button" style="height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #E4E7F0; border-radius: 12px; background: #fff; font: 500 13px Inter, sans-serif; color: #0F1733; cursor: pointer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#223CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    Poblacion Branch
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555C78" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding: 0 4px">
    <span style="font: 600 14px Inter, sans-serif; font-variant-numeric: tabular-nums">{{time}}</span>
    <span style="font: 400 11px Inter, sans-serif; color: #555C78; white-space: nowrap">{{date}} · PHT</span>
  </div>

  <div style="display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="Notifications, 6 unread" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E7F0; background: #fff; display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A4160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span style="position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 999px; background: #DE1339; color: #fff; font: 700 10px Inter, sans-serif; display: grid; place-items: center; border: 2px solid #fff; box-sizing: content-box">6</span>
    </button>
    <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E7F0; background: #fff; display: grid; place-items: center; cursor: pointer">
      <sc-if value="{{dark}}" hint-placeholder-val="{{ false }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A4160" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </sc-if>
      <sc-if value="{{light}}" hint-placeholder-val="{{ true }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A4160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </sc-if>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid #E4E7F0">
    <span style="width: 40px; height: 40px; border-radius: 50%; background: #223CFF; color: #fff; display: grid; place-items: center; font: 600 14px Poppins, sans-serif">{{initials}}</span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font: 600 13px Inter, sans-serif; white-space: nowrap">{{userName}}</span>
      <span style="display: inline-flex; align-self: flex-start; height: 18px; align-items: center; padding: 0 7px; border-radius: 999px; background: #EEF1FF; color: #1A2FCC; font: 700 10px Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase">{{role}}</span>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Dashboard"},"subtitle":{"editor":"text","default":"Overview of today’s pharmacy operations"},"role":{"editor":"enum","options":["Administrator","Pharmacist","Cashier","Inventory Staff"],"default":"Administrator"},"$preview":{"width":1192,"height":72}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { now: new Date(), dark: false }; }
  componentDidMount() { this.t = setInterval(() => this.setState({ now: new Date() }), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const tz = 'Asia/Manila';
    const now = this.state.now;
    const role = this.props.role ?? 'Administrator';
    const people = { 'Administrator': ['Yasmin Marquez', 'YM'], 'Pharmacist': ['Jose Reyes, RPh', 'JR'], 'Cashier': ['Maria Santos', 'MS'], 'Inventory Staff': ['Paolo Lim', 'PL'] };
    const p = people[role] || people['Administrator'];
    return {
      title: this.props.title ?? 'Dashboard',
      subtitle: this.props.subtitle ?? 'Overview of today’s pharmacy operations',
      role,
      userName: p[0],
      initials: p[1],
      time: now.toLocaleTimeString('en-PH', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      date: now.toLocaleDateString('en-PH', { timeZone: tz, weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }),
      dark: this.state.dark,
      light: !this.state.dark,
      themeLabel: this.state.dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.setState({ dark: !this.state.dark }),
    };
  }
}
</script>
</body>
</html>
